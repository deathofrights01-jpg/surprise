<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Surprise ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div id="quiz">

<h1>I Have 5 Questions For You ❤️</h1>

<h2 id="question"></h2>

<div class="buttons">

<button id="yesBtn" class="yes">Yes ❤️</button>

<button id="noBtn" class="no">No 💔</button>

</div>

<button id="submitBtn">
Open My Surprise 🎁
</button>

</div>



<div id="message">

<div class="heart">❤️</div>

<h2>Congratulations My Love ❤️</h2>

<p>

No matter what your answers were...

I just wanted to remind you that you're the most beautiful person in my life.

Thank you for every smile, every laugh and every memory.

I hope this brings a smile to your face .

I Love You Forever ❤️

</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
